services:
  - type: web
    name: meetmind
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: pip install gunicorn && gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: "3.11.0"